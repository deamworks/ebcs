<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแล — e-BCS กสทช.</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin-login.css">
  </head>
<body>

  <!-- Logo -->
  <div class="login-logo">
    <div class="brand-badge"><span>e</span>-BCS</div>
    <div class="brand-sub">ระบบนำส่งเงินรายปีเข้ากองทุนวิจัยและพัฒนา กสทช.</div>
    <div class="admin-tag">ADMIN PORTAL</div>
  </div>

  <!-- Card -->
  <div class="login-card">
    <div class="login-card-header">
      <h2>เข้าสู่ระบบผู้ดูแล</h2>
      <p>สำหรับเจ้าหน้าที่ กสทช. เท่านั้น</p>
    </div>
    <div class="login-card-body">

      <div class="login-error" id="loginError"></div>

      <div class="field-group">
        <label for="loginEmail">อีเมล</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="admin@nbtc.go.th"
          autocomplete="email"
          onkeydown="if(event.key==='Enter') document.getElementById('loginPassword').focus()"
        >
      </div>

      <div class="field-group">
        <label for="loginPassword">รหัสผ่าน</label>
        <div class="pwd-field-wrap">
          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') handleLogin()"
          >
          <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility(this)" tabindex="-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
            <svg class="pwd-icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pwd-icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        เข้าสู่ระบบ
      </button>

    </div>
  </div>

  <div class="login-footer">
    ระบบ e-BCS กสทช. &nbsp;·&nbsp; สงวนสิทธิ์เฉพาะเจ้าหน้าที่
  </div>

  <script src="../js/api-client.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
