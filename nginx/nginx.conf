
# Nginx Configuration — NBTC Filing
# หน้าที่: แยกการจราจร
#   /        → ไฟล์ static (HTML/CSS/JS)
#   /api/... → ส่งต่อไป Flask


server {
    listen 80;         # ฟังที่ port 80
    server_name _;     # _ หมายถึงรับทุก domain/IP

    # ขนาดไฟล์อัปโหลดสูงสุด (ต้องตรงกับ MAX_UPLOAD_MB ใน .env)
    client_max_body_size 10M;

    # โฟลเดอร์ที่เก็บไฟล์ static (ตรงกับ volume ใน docker-compose)
    root /usr/share/nginx/html;

    # หน้าแรก
    index pages/login.html;

    # หน้าแรก / → redirect ไปหน้า login
    location = / {
        return 302 /pages/login.html;
    }

    # ไฟล์ static ทั่วไป (HTML, CSS, JS, รูปภาพ)
    # try_files = ลองหาไฟล์ที่ขอ ถ้าไม่มีให้ 404
    location / {
        try_files $uri $uri/ =404;
    }

    # API requests — ส่งต่อไป Flask
    # flask-api คือชื่อ container ใน docker-compose
    # Docker แปลงชื่อ container เป็น IP ให้อัตโนมัติ
    location /api/ {
        proxy_pass http://flask-api:5000;

        # ส่ง header ต้นทางไปด้วย (Flask จะรู้ IP จริงของผู้ใช้)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # รอ Flask ตอบได้นาน 60 วินาที (เผื่อ export Excel ไฟล์ใหญ่)
        proxy_read_timeout 60s;
    }

    # ปิดกั้นการเข้าถึงไฟล์แนบตรงๆ ทุกคนที่รู้ URL จะถูกปฏิเสธ ต้องดาวน์โหลดผ่าน Flask (ตรวจ token ก่อน) เท่านั้น
    location /uploads/ {
        deny all;
        return 403;
    }
}